<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>待機頁 - 員工積點餐系統</title>
<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --primary:#0f172a;
  --primary-contrast:#ffffff;
  --accent:#2563eb;
  --success:#16a34a;
  --success-soft:#dcfce7;
  --danger:#dc2626;
  --danger-soft:#fee2e2;
  --warning:#d97706;
  --warning-soft:#fef3c7;
  --shadow:0 10px 28px rgba(15,23,42,.06);
  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
  --touch:64px;
}
[data-theme="dark"]{
  --bg:#0b1220;
  --surface:#111827;
  --surface-2:#0f172a;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#243041;
  --primary:#f8fafc;
  --primary-contrast:#0b1220;
  --accent:#60a5fa;
  --success:#22c55e;
  --success-soft:#052e16;
  --danger:#f87171;
  --danger-soft:#3b0d15;
  --warning:#f59e0b;
  --warning-soft:#3b2a0a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}
button{font:inherit}
button:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}
.app{
  height:100vh;
  display:grid;
  grid-template-rows:84px 1fr 88px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.brand{
  display:flex;
  gap:14px;
  align-items:center;
}
.brand-badge{
  width:46px;height:46px;border-radius:14px;
  background:var(--primary);
  color:var(--primary-contrast);
  display:grid;place-items:center;
  font-weight:800;font-size:16px;
}
.brand h1{
  margin:0;
  font-size:22px;
  line-height:1.1;
}
.brand small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}
.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}
.pill{
  min-height:40px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:999px;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:700;
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--success);
}
.icon-btn{
  min-width:122px;
  height:44px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}
.viewport{
  padding:24px 28px;
  display:grid;
  grid-template-columns:1.55fr .85fr;
  gap:20px;
  min-height:0;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow);
}
.left{
  display:grid;
  grid-template-rows:auto auto 1fr;
  gap:18px;
  min-height:0;
}
.right{
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:18px;
  min-height:0;
}
.result{
  padding:30px 30px 28px;
}
.result-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
.result-main{
  display:flex;
  gap:18px;
  align-items:flex-start;
}
.result-icon{
  width:84px;height:84px;border-radius:24px;
  display:grid;place-items:center;
  flex:0 0 auto;
}
.eyebrow{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.result h2{
  margin:0;
  font-size:46px;
  line-height:1.05;
  letter-spacing:-.03em;
}
.result p{
  margin:12px 0 0;
  color:var(--muted);
  font-size:20px;
  line-height:1.45;
  max-width:680px;
}
.tx{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  color:var(--muted);
  font-size:14px;
  white-space:nowrap;
}
.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.metric{
  padding:22px 24px;
}
.metric .label{
  color:var(--muted);
  font-size:15px;
  margin-bottom:8px;
}
.metric .value{
  font-size:34px;
  font-weight:800;
  letter-spacing:-.02em;
}
.metric .sub{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}
.order{
  padding:24px 26px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:16px;
}
.order-table{
  width:100%;
  border-collapse:collapse;
  font-size:18px;
}
.order-table th{
  color:var(--muted);
  font-weight:700;
  text-align:left;
  padding:12px 6px;
  border-bottom:1px solid var(--line);
}
.order-table td{
  padding:18px 6px;
  border-bottom:1px solid var(--line);
}
.order-table td:nth-child(2),
.order-table td:nth-child(3),
.order-table th:nth-child(2),
.order-table th:nth-child(3){
  text-align:right;
}
.member{
  padding:22px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.member-main{
  display:flex;
  gap:14px;
  align-items:center;
}
.avatar{
  width:66px;height:66px;border-radius:18px;
  background:var(--surface-2);
  display:grid;place-items:center;
  font-size:24px;font-weight:800;
}
.member-name{
  font-size:24px;
  font-weight:800;
}
.member-sub{
  color:var(--muted);
  margin-top:4px;
  font-size:14px;
}
.verify{
  border:1px solid var(--line);
  background:var(--surface-2);
  padding:10px 12px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
}
.points{
  padding:26px 24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.points .title{
  color:var(--muted);
  font-size:15px;
  font-weight:700;
}
.points .big{
  margin-top:8px;
  font-size:54px;
  font-weight:900;
  letter-spacing:-.04em;
}
.points .big small{
  font-size:20px;
  color:var(--muted);
}
.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}
.mini{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
}
.mini .k{
  color:var(--muted);
  font-size:13px;
  margin-bottom:5px;
}
.mini .v{
  font-size:22px;
  font-weight:800;
}
.note{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:14px;
}
.actions-card{
  padding:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn{
  height:var(--touch);
  border-radius:16px;
  border:1px solid var(--line);
  font-size:20px;
  font-weight:800;
  cursor:pointer;
}
.btn.secondary{
  background:var(--surface);
  color:var(--text);
}
.btn.primary{
  background:var(--primary);
  color:var(--primary-contrast);
  border-color:var(--primary);
}
.footer{
  border-top:1px solid var(--line);
  background:var(--surface);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
}
.status-group{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.status-chip{
  min-height:38px;
  border:1px solid var(--line);
  background:var(--surface-2);
  border-radius:999px;
  padding:0 12px;
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;
  color:var(--muted);
}
.page-nav{
  position:fixed;
  top:96px;
  right:28px;
  z-index:20;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  max-width:560px;
}
.page-nav a{
  text-decoration:none;
  height:38px;
  min-width:96px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text);
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}
.page-nav a.active{
  background:var(--primary);
  color:var(--primary-contrast);
  border-color:var(--primary);
}
.state-success .result-icon{background:var(--success-soft); color:var(--success)}
.state-error .result-icon{background:var(--danger-soft); color:var(--danger)}
.state-idle .result-icon{background:var(--surface-2); color:var(--muted)}
.state-reading .result-icon{background:rgba(37,99,235,.12); color:var(--accent)}
.state-idle .metrics,
.state-idle .order{
  display:none;
}
.state-idle .left{
  grid-template-rows:1fr;
}
.state-idle .result{
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.state-idle .result-top{
  align-items:center;
}
.spinner{
  width:34px;height:34px;border-radius:50%;
  border:4px solid rgba(37,99,235,.18);
  border-top-color:var(--accent);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1180px){
  .viewport{grid-template-columns:1fr; overflow:auto;}
  body{overflow:auto}
  .app{height:auto; min-height:100vh}
  .result h2{font-size:38px}
  .page-nav{position:static; margin:16px 28px 0}
}
</style>
</head>
<body data-theme="light">
<div class="page-nav"><a href="pos_idle.html" class="active">待機頁</a><a href="pos_reading.html" class="">讀取中頁</a><a href="pos_success.html" class="">成功頁</a><a href="pos_error.html" class="">錯誤頁</a></div>

<div class="app state-idle">
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">POS</div>
      <div>
        <h1>員工積點餐系統</h1>
        <small>正式版 HTML · RFID Reader + API DB</small>
      </div>
    </div>
    <div class="top-actions">
      <div class="pill"><span class="dot"></span>等待使用</div>
      <button class="icon-btn" id="themeToggle" type="button">切換深色模式</button>
    </div>
  </header>

  <main class="viewport">
    <section class="left">
      <section class="card result">
        <div class="result-top">
          <div class="result-main">
            <div class="result-icon"><svg width="42" height="42" viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="3.5" height="8" rx="1" stroke="currentColor" stroke-width="2"/><path d="M8 5.5A8 8 0 0 1 8 18.5M11 8a4.8 4.8 0 0 1 0 8M14 10.5a1.8 1.8 0 0 1 0 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>
            <div>
              <div class="eyebrow">READY FOR RFID</div>
              <h2>請感應員工卡</h2>
              <p>將員工卡靠近 RFID 感應區，系統會自動讀取身分與會員積點資訊。</p>
            </div>
          </div>
          <div class="tx">等待感應</div>
        </div>
      </section>

      
      
    </section>

    <aside class="right">
      <section class="card member">
        <div class="member-main">
          <div class="avatar">陳</div>
          <div>
            <div class="member-name">陳○○</div>
            <div class="member-sub">員工編號 RD-00128 · RFID 已辨識</div>
          </div>
        </div>
        <div class="verify">待感應</div>
      </section>

      <section class="card points">
        <div>
          <div class="title">會員點數資訊</div>
          <div class="big">1,300 <small>點</small></div>
          <div class="mini-grid">
            <div class="mini">
              <div class="k">本次異動</div>
              <div class="v">--</div>
            </div>
            <div class="mini">
              <div class="k">本月次數</div>
              <div class="v">7 次</div>
            </div>
          </div>
        </div>
        <div class="note">待機模式中，感應後將自動查詢會員與餐點資料。</div>
      </section>

      <section class="card actions-card">
        <button class="btn secondary" type="button">重新感應</button>
        <button class="btn primary" type="button">完成</button>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <div class="status-group">
      <div class="status-chip"><span class="dot"></span>API Connected</div>
      <div class="status-chip"><span class="dot"></span>RFID Reader Ready</div>
      <div class="status-chip">Terminal 01</div>
      <div class="status-chip" id="clockChip">2026/09/14 14:01</div>
    </div>
    <div class="status-chip">待機頁</div>
  </footer>
</div>

<script>
function applyTheme(theme){
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('pos-theme', theme);
  const btn = document.getElementById('themeToggle');
  if(btn){
    btn.textContent = theme === 'dark' ? '切換淺色模式' : '切換深色模式';
  }
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const current = document.body.getAttribute('data-theme') || 'light';
  applyTheme(current === 'light' ? 'dark' : 'light');
});
(function initTheme(){
  const saved = localStorage.getItem('pos-theme') || 'light';
  applyTheme(saved);
})();
function tickClock(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const text = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const chip = document.getElementById('clockChip');
  if(chip) chip.textContent = text;
}
tickClock();
setInterval(tickClock, 30000);
</script>

</body>
</html>
